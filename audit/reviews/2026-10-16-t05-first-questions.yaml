    {
      "id": "Q111",
      "source": "new",
      "text_en": "Compare strategy-plan actual revenue, budget and attainment by category in 2009.",
      "text_zh": "按战略计划表，比较2009年各产品品类销售收入的实际数、预算数和预算达成率。",
