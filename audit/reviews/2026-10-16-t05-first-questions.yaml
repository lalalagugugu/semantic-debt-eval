      "text_en": "For each month of 2009, show revenue from customers with at least two lifetime orders before month-start and its share.",
      "text_zh": "2009年每个月的销售额中，有多少来自在该月开始前已经累计下过至少2笔订单的客户？列出这类客户当月销售额和占比。",
