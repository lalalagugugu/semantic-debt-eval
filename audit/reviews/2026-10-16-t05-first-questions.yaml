      "id": "Q122",
      "source": "new",
      "text_en": "For all unordered pairs of categories appearing in 2009 orders, show basket Jaccard similarity and intersection/union order counts.",
      "text_zh": "对2009年的订单，按产品品类两两计算购物篮Jaccard相似度：同时含两品类的订单数÷至少含其中一品类的订单数。每个无序品类对仅一行，并列出交集、并集订单数；只纳入当年至少出现过一次的品类。",
      "type": "统计",
      "refs": [
        {
          "interpretation": "题干限定口径",
          "sql": "WITH baskets AS (SELECT s.SalesOrderNumber AS order_id,groupUniqArray(pc.ProductCategoryKey) AS cats FROM retail.FactOnlineSales s JOIN retail.DimProduct p ON s.ProductKey=p.ProductKey JOIN retail.DimProductSubcategory sc ON p.ProductSubcategoryKey=sc.ProductSubcategoryKey JOIN retail.DimProductCategory pc ON sc.ProductCategoryKey=pc.ProductCategoryKey WHERE s.DateKey >= '2009-01-01' AND s.DateKey < '2010-01-01' GROUP BY order_id), marginal AS (SELECT cat,count() AS orders FROM (SELECT arrayJoin(cats) AS cat FROM baskets) GROUP BY cat), pairs AS (SELECT a AS category_a,b AS category_b,count() AS intersection_orders FROM (SELECT cats,arrayJoin(cats) AS a FROM baskets) ARRAY JOIN cats AS b WHERE a<b GROUP BY a,b) SELECT ca.ProductCategoryName AS category_a,cb.ProductCategoryName AS category_b,ifNull(p.intersection_orders,0) AS intersection_orders,ma.orders+mb.orders-ifNull(p.intersection_orders,0) AS union_orders,ifNull(p.intersection_orders,0)/nullIf(ma.orders+mb.orders-ifNull(p.intersection_orders,0),0) AS jaccard_ratio FROM marginal ma CROSS JOIN marginal mb LEFT JOIN pairs p ON ma.cat=p.category_a AND mb.cat=p.category_b JOIN retail.DimProductCategory ca ON ma.cat=ca.ProductCategoryKey JOIN retail.DimProductCategory cb ON mb.cat=cb.ProductCategoryKey WHERE ma.cat<mb.cat",
