          "sql": "WITH starts AS (SELECT addMonths(toDate('2009-01-01'),number) AS month FROM numbers(12)), prior AS (SELECT m.month AS month,s.CustomerKey AS customer_id,uniqExactIf(s.SalesOrderNumber,s.DateKey<m.month) AS prior_orders FROM retail.FactOnlineSales s CROSS JOIN starts m GROUP BY month,customer_id), current AS (SELECT toStartOfMonth(DateKey) AS month,CustomerKey AS customer_id,sum(SalesAmount) AS sales_amount FROM retail.FactOnlineSales WHERE DateKey >= '2009-01-01' AND DateKey < '2010-01-01' GROUP BY month,customer_id) SELECT c.month,sumIf(c.sales_amount,p.prior_orders>=2) AS repeat_amount,sumIf(c.sales_amount,p.prior_orders>=2)*100/nullIf(sum(c.sales_amount),0) AS repeat_share_pct FROM current c JOIN prior p ON c.month=p.month AND c.customer_id=p.customer_id GROUP BY c.month",
