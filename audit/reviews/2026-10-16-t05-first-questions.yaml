          "sql": "WITH actuals AS (SELECT StoreKey,sum(SalesAmount) AS sales_amount FROM retail.FactSales WHERE DateKey >= '2009-01-01' AND DateKey < '2010-01-01' GROUP BY StoreKey), targets AS (SELECT StoreKey,sum(SalesAmountQuota) AS quota_amount FROM retail.FactSalesQuota WHERE ScenarioKey=2 AND DateKey >= '2009-01-01' AND DateKey < '2010-01-01' GROUP BY StoreKey) SELECT d.StoreName,a.sales_amount,t.quota_amount,a.sales_amount*100/nullIf(t.quota_amount,0) AS attainment_pct FROM actuals a JOIN targets t ON a.StoreKey=t.StoreKey JOIN retail.DimStore d ON a.StoreKey=d.StoreKey",
          "result_path": "refs/new/Q112-1.csv"
        }
      ],
      "scoring": "deterministic",
      "scoring_notes": "按门店先分别聚合actual和quota再连接，禁止事实表原粒度互连扇出；正式目标ScenarioKey=2，全渠道。",
