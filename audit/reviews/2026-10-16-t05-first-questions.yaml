      "source": "new",
      "text_en": "For same stores with declining 2009 total sales, show declining categories and their contribution to the store decline.",
      "text_zh": "在2009年同店销售额下降的门店中，列出各店销售额也下降的产品品类、下降金额，以及该金额占门店总下降金额的百分比。",
      "type": "指标分析",
      "refs": [
        {
          "interpretation": "题干限定口径",
          "sql": "WITH categories AS (SELECT s.StoreKey AS store_id,pc.ProductCategoryName AS category,sumIf(s.SalesAmount,toYear(s.DateKey)=2008) AS sales_2008,sumIf(s.SalesAmount,toYear(s.DateKey)=2009) AS sales_2009,countIf(toYear(s.DateKey)=2008) AS rows_2008,countIf(toYear(s.DateKey)=2009) AS rows_2009 FROM retail.FactSales s JOIN retail.DimProduct p ON s.ProductKey=p.ProductKey JOIN retail.DimProductSubcategory sc ON p.ProductSubcategoryKey=sc.ProductSubcategoryKey JOIN retail.DimProductCategory pc ON sc.ProductCategoryKey=pc.ProductCategoryKey WHERE s.DateKey >= '2008-01-01' AND s.DateKey < '2010-01-01' GROUP BY store_id,category), stores AS (SELECT store_id,sum(sales_2008) AS total_2008,sum(sales_2009) AS total_2009 FROM categories GROUP BY store_id HAVING sum(rows_2008)>0 AND sum(rows_2009)>0 AND total_2009<total_2008) SELECT d.StoreName,c.category,c.sales_2008-c.sales_2009 AS decline_amount,(c.sales_2008-c.sales_2009)*100/nullIf(t.total_2008-t.total_2009,0) AS contribution_pct FROM categories c JOIN stores t ON c.store_id=t.store_id JOIN retail.DimStore d ON c.store_id=d.StoreKey WHERE c.sales_2009<c.sales_2008",
