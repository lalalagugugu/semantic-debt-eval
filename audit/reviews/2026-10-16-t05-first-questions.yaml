    {
      "id": "Q121",
      "source": "new",
      "text_en": "By category, correlate daily realized promotion discount ratio with daily units sold in 2009, excluding no-discount transactions.",
      "text_zh": "按产品品类，用2009年每日促销交易计算折扣力度与销量的Pearson相关系数及观察日数。每日折扣力度=折扣金额÷（销售额+折扣金额），销量为每日销售数量；排除无折扣交易，不把相关性解释为因果。",
      "type": "统计",
      "refs": [
        {
          "interpretation": "题干限定口径",
          "sql": "WITH daily AS (SELECT pc.ProductCategoryName AS category,s.DateKey AS day,sum(s.DiscountAmount)/nullIf(sum(s.SalesAmount+s.DiscountAmount),0) AS discount_ratio,sum(s.SalesQuantity) AS units FROM retail.FactOnlineSales s JOIN retail.DimProduct p ON s.ProductKey=p.ProductKey JOIN retail.DimProductSubcategory sc ON p.ProductSubcategoryKey=sc.ProductSubcategoryKey JOIN retail.DimProductCategory pc ON sc.ProductCategoryKey=pc.ProductCategoryKey WHERE s.DateKey >= '2009-01-01' AND s.DateKey < '2010-01-01' AND s.PromotionKey!=1 GROUP BY category,day) SELECT category,count() AS observations,corr(discount_ratio,units) AS correlation FROM daily WHERE discount_ratio IS NOT NULL GROUP BY category",
          "result_path": "refs/new/Q121-1.csv"
        }
      ],
      "scoring": "deterministic",
      "scoring_notes": "每日品类等权，只含该品类当日有促销交易且折前金额非零的日期；不填补无促销日为零，不按促销记录数加权，不声称价格弹性或因果增量。",
      "labels": {
        "q_level": "Q3",
        "complexity_source": {
          "primary": "超出查询语言",
