    {
      "id": "Q109",
      "source": "new",
      "text_en": "How much higher was average daily sales on holidays than non-holidays in 2009?",
      "text_zh": "2009年节假日平均每天的销售额比非节假日高百分之多少？",
      "type": "指标分析",
      "refs": [
        {
          "interpretation": "题干限定口径",
          "sql": "WITH daily AS (SELECT s.DateKey AS day,d.IsHoliday AS holiday,sum(s.SalesAmount) AS daily_sales FROM retail.FactOnlineSales s JOIN retail.DimDate d ON s.DateKey=d.DateKey WHERE s.DateKey >= '2009-01-01' AND s.DateKey < '2010-01-01' GROUP BY day,holiday) SELECT (avgIf(daily_sales,holiday='Yes')/nullIf(avgIf(daily_sales,holiday='No'),0)-1)*100 AS uplift_pct FROM daily",
          "result_path": "refs/new/Q109-1.csv"
        }
      ],
      "scoring": "deterministic",
      "scoring_notes": "先按交易日期汇总，再比较日均；2009全年销售日期须完整覆盖日期表，避免无销售日被遗漏。IsHoliday枚举在探查中核对。",
      "labels": {
