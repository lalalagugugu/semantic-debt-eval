# action 取值：
#   fix_reference            修参考答案，问句不变
#   scoring_rule             参考答案不变，靠评分规则处理
#   rewrite                  改写问句并重算参考答案
#   accepted_interpretations 问句不变，模型须声明假设；列出可接受解读，每个解读一份参考结果
#   judge_with_interpretations 统计或开放式题，由宽松裁判评分，裁判拿到可接受解读清单
#   keep                     原样保留
#   open_ended_repair        保留为开放式题，修复参考答案

