          "interpretation": "共购按不同订单计数：每订单内产品去重；保留产品键与缺失名称。前20仅是judge示例，不是题干固定N。；购买事件=全部行",
          "sql": "WITH baskets AS (\n  SELECT SalesOrderNumber,arraySort(groupUniqArray(ProductKey)) AS products\n  FROM retail.FactOnlineSales GROUP BY SalesOrderNumber\n), first_product AS (\n  SELECT SalesOrderNumber,products,arrayJoin(products) AS product1_key FROM baskets\n), pairs AS (\n  SELECT product1_key,product2_key,count() AS co_order_count\n  FROM first_product ARRAY JOIN products AS product2_key\n  WHERE product1_key<product2_key GROUP BY product1_key,product2_key\n)\nSELECT x.product1_key,x.product2_key,\n       if(p1.ProductKey=0,NULL,p1.ProductName) AS product1,\n       if(p2.ProductKey=0,NULL,p2.ProductName) AS product2,\n       x.co_order_count\nFROM pairs x\nLEFT JOIN retail.DimProduct p1 ON x.product1_key=p1.ProductKey\nLEFT JOIN retail.DimProduct p2 ON x.product2_key=p2.ProductKey\nORDER BY co_order_count DESC,product1_key,product2_key LIMIT 20",
