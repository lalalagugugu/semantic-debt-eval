    {
      "id": "Q71",
      "source": "cube",
      "text_en": "For each product category, which subcategory had the highest online sales in 2009, and what was that amount?",
      "text_zh": "2009 年每个产品品类中，哪个子品类的线上销售额最高？金额是多少？",
