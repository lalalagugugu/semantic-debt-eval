      "id": "Q10",
      "source": "cube",
      "text_en": "How many stores are currently open?",
      "text_zh": "目前有多少家门店在营业？",
      "type": "指标分析",
      "refs": [
        {
          "interpretation": "状态为 On",
          "sql": "SELECT count() AS store_count FROM retail.DimStore WHERE Status = 'On'",
          "result_path": "refs/cube/Q10-1.csv"
        },
        {
          "interpretation": "关店日期为 SQL NULL",
          "sql": "SELECT count() AS store_count FROM retail.DimStore WHERE CloseDate IS NULL",
          "result_path": "refs/cube/Q10-2.csv"
        },
        {
          "interpretation": "状态为 On 或关店日期为 SQL NULL",
          "sql": "SELECT count() AS store_count FROM retail.DimStore WHERE Status = 'On' OR CloseDate IS NULL",
          "result_path": "refs/cube/Q10-3.csv"
        }
      ],
      "scoring": "deterministic",
      "scoring_notes": "须声明营业判据。SQL NULL 与字符串占位值不等价；三个判据分别重算，不按结果预先合并。",
      "labels": {
