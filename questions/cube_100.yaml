      "text_en": "Perform ABC analysis on products for 2009: identify the 'A' products (top 80% of revenue), 'B' (next 15%), and 'C' (remaining 5%), and report how many products fall in each class.",
      "text_zh": "对 2009 年产品营收做 ABC 分析：A 类占营收前 80%，B 类占接下来的 15%，C 类占其余 5%；报告各类产品数量。",
      "type": "指标分析",
      "refs": [
        {
          "interpretation": "原参考解读",
          "sql": "WITH prod_rev AS (\n  SELECT ProductKey, SUM(SalesAmount) AS rev\n  FROM retail.FactOnlineSales\n  WHERE toYear(DateKey) = 2009\n  GROUP BY ProductKey\n),\nranked AS (\n  SELECT ProductKey, rev,\n         SUM(rev) OVER (ORDER BY rev DESC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cum_rev,\n         SUM(rev) OVER () AS total_rev\n  FROM prod_rev\n),\nclassed AS (\n  SELECT ProductKey,\n         CASE WHEN cum_rev / total_rev <= 0.80 THEN 'A'\n              WHEN cum_rev / total_rev <= 0.95 THEN 'B'\n              ELSE 'C' END AS abc_class,\n         rev\n  FROM ranked\n)\nSELECT abc_class,\n       count() AS product_count,\n       round(sum(rev), 2) AS revenue,\n       round(sum(rev) * 100.0 / (SELECT sum(rev) FROM prod_rev), 2) AS pct_of_revenue\nFROM classed\nGROUP BY abc_class\nORDER BY abc_class",
          "result_path": "refs/cube/Q84-1.csv"
        }
