    {
      "id": "Q86",
      "source": "cube",
      "text_en": "Analyze the relationship between discount depth and sales volume: for each product subcategory, show the correlation between promotion discount percent and sales quantity in 2009.",
      "text_zh": "分析折扣力度与销量的关系：按产品子品类展示 2009 年促销折扣比例与销售数量的相关系数。",
      "type": "统计",
      "refs": [
        {
          "interpretation": "原参考解读；按题面补全全部满足原样本下限的子品类，不截前20",
          "sql": "WITH enriched AS (\n  SELECT psc.ProductSubcategoryName,\n         p.DiscountPercent,\n         fos.SalesQuantity\n  FROM retail.FactOnlineSales fos\n  JOIN retail.DimPromotion p ON p.PromotionKey = fos.PromotionKey\n  LEFT JOIN (SELECT ProductKey,toNullable(ProductName) AS ProductName,ProductSubcategoryKey,BrandName,ColorName,AvailableForSaleDate FROM retail.DimProduct) dp ON dp.ProductKey = fos.ProductKey\n  LEFT JOIN (SELECT ProductSubcategoryKey,toNullable(ProductSubcategoryName) AS ProductSubcategoryName,ProductCategoryKey FROM retail.DimProductSubcategory) psc ON toInt32(dp.ProductSubcategoryKey) = psc.ProductSubcategoryKey\n  WHERE toYear(fos.DateKey) = 2009 AND p.DiscountPercent IS NOT NULL AND p.PromotionKey <> 1\n),\nstats AS (\n  SELECT ProductSubcategoryName,\n         corr(DiscountPercent, SalesQuantity) AS discount_qty_corr,\n         count() AS observations\n  FROM enriched\n  GROUP BY ProductSubcategoryName\n  HAVING observations > 100\n)\nSELECT ProductSubcategoryName,\n       round(discount_qty_corr, 3) AS corr_discount_vs_qty,\n       observations\nFROM stats\nORDER BY discount_qty_corr DESC",
          "result_path": "refs/cube/Q86-1.csv"
        },
        {
          "interpretation": "问法歧义：Spearman相关，按全部促销观察的精确频数计算并列中秩，样本域同Pearson",
          "sql": "WITH domain AS (WITH enriched AS (\n  SELECT psc.ProductSubcategoryName,\n         p.DiscountPercent,\n         fos.SalesQuantity\n  FROM retail.FactOnlineSales fos\n  JOIN retail.DimPromotion p ON p.PromotionKey = fos.PromotionKey\n  LEFT JOIN (SELECT ProductKey,toNullable(ProductName) AS ProductName,ProductSubcategoryKey,BrandName,ColorName,AvailableForSaleDate FROM retail.DimProduct) dp ON dp.ProductKey = fos.ProductKey\n  LEFT JOIN (SELECT ProductSubcategoryKey,toNullable(ProductSubcategoryName) AS ProductSubcategoryName,ProductCategoryKey FROM retail.DimProductSubcategory) psc ON toInt32(dp.ProductSubcategoryKey) = psc.ProductSubcategoryKey\n  WHERE toYear(fos.DateKey) = 2009 AND p.DiscountPercent IS NOT NULL AND p.PromotionKey <> 1\n) SELECT ProductSubcategoryName,DiscountPercent AS x,SalesQuantity AS y FROM enriched),\nfrequency AS (SELECT ProductSubcategoryName,x,y,count() AS w FROM domain WHERE x IS NOT NULL AND y IS NOT NULL GROUP BY ProductSubcategoryName,x,y),\nranks AS (SELECT *,\nsum(w) OVER (PARTITION BY ProductSubcategoryName ORDER BY x RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)-(sum(w) OVER (PARTITION BY ProductSubcategoryName,x)-1)/2.0 AS rx,\nsum(w) OVER (PARTITION BY ProductSubcategoryName ORDER BY y RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)-(sum(w) OVER (PARTITION BY ProductSubcategoryName,y)-1)/2.0 AS ry FROM frequency),\ncentered AS (SELECT *,sum(w*rx) OVER (PARTITION BY ProductSubcategoryName)/sum(w) OVER (PARTITION BY ProductSubcategoryName) AS mx,\nsum(w*ry) OVER (PARTITION BY ProductSubcategoryName)/sum(w) OVER (PARTITION BY ProductSubcategoryName) AS my FROM ranks)\nSELECT ProductSubcategoryName,sum(w*(rx-mx)*(ry-my))/nullIf(sqrt(sum(w*pow(rx-mx,2))*sum(w*pow(ry-my,2))),0) AS corr_discount_vs_qty,sum(w) AS observations\nFROM centered GROUP BY ProductSubcategoryName HAVING observations>100",
          "result_path": "refs/cube/Q86-3.csv"
        }
