      "source": "cube",
      "text_en": "Is there a correlation between IT outages and sales performance?",
      "text_zh": "IT 故障与销售表现之间有相关关系吗？",
      "type": "统计",
      "refs": [
        {
          "interpretation": "示例：声明停机总时长超过1000分钟分组，比较门店平均全渠道销售",
          "sql": "-- Complex: comparing stores with high outages vs low outages\nWITH store_outages AS (SELECT StoreKey, count() as outage_count, sum(DownTime) as total_downtime FROM retail.FactITSLA GROUP BY StoreKey), store_sales AS (SELECT StoreKey, sum(SalesAmount) as total_sales FROM retail.FactSales GROUP BY StoreKey) SELECT CASE WHEN ifNull(so.total_downtime,0) > 1000 THEN 'High Downtime' ELSE 'Low Downtime' END as downtime_group, avg(ss.total_sales) as avg_sales, count() as store_count FROM store_sales ss LEFT JOIN store_outages so ON so.StoreKey = ss.StoreKey GROUP BY downtime_group",
          "result_path": "refs/cube/Q48-1.csv"
        },
        {
          "interpretation": "门店停机总时长与全渠道销售额的相关系数",
          "sql": "WITH outages AS (SELECT StoreKey,sum(DownTime) AS downtime FROM retail.FactITSLA GROUP BY StoreKey), sales AS (SELECT StoreKey,sum(SalesAmount) AS sales_amount FROM retail.FactSales GROUP BY StoreKey) SELECT corr(ifNull(o.downtime,0),s.sales_amount) AS correlation FROM sales s LEFT JOIN outages o ON o.StoreKey=s.StoreKey",
          "result_path": "refs/cube/Q48-2.csv",
          "rules": {
            "ordered": false,
            "top_n": null,
            "tie_columns": [],
            "value_kinds": [
              "ratio"
            ],
            "value_types": [
              "Float64"
            ]
          }
        },
        {
          "interpretation": "问法歧义：Spearman相关，重复值使用平均秩，观察域与Pearson一致",
          "sql": "WITH domain AS (WITH o AS (SELECT StoreKey,sum(DownTime) AS downtime FROM retail.FactITSLA GROUP BY StoreKey),s AS (SELECT StoreKey,sum(SalesAmount) AS sales FROM retail.FactSales GROUP BY StoreKey) SELECT ifNull(o.downtime,0) AS x,s.sales AS y FROM s LEFT JOIN o ON s.StoreKey=o.StoreKey),\nfrequency AS (SELECT x,y,count() AS w FROM domain WHERE x IS NOT NULL AND y IS NOT NULL GROUP BY x,y),\nranks AS (SELECT *,\nsum(w) OVER (ORDER BY x RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)-(sum(w) OVER (PARTITION BY x)-1)/2.0 AS rx,\nsum(w) OVER (ORDER BY y RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)-(sum(w) OVER (PARTITION BY y)-1)/2.0 AS ry FROM frequency),\ncentered AS (SELECT *,sum(w*rx) OVER ()/sum(w) OVER () AS mx,\nsum(w*ry) OVER ()/sum(w) OVER () AS my FROM ranks)\nSELECT sum(w*(rx-mx)*(ry-my))/nullIf(sqrt(sum(w*pow(rx-mx,2))*sum(w*pow(ry-my,2))),0) AS correlation\nFROM centered",
          "result_path": "refs/cube/Q48-3.csv",
          "rules": {
            "ordered": false,
            "top_n": null,
            "tie_columns": [],
            "value_kinds": [
              "ratio"
            ],
            "value_types": [
              "Nullable(Float64)"
            ]
          }
        }
      ],
