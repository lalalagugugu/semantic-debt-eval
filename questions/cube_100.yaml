      "type": "统计",
      "refs": [
        {
          "interpretation": "原参考解读；购买事件=全部行（含纯退货行）",
          "sql": "SELECT corr(c.YearlyIncome, cust_spend.total_spend) AS income_spend_correlation,\n       count() AS customers_analyzed\nFROM (\n  SELECT CustomerKey, sum(SalesAmount) AS total_spend\n  FROM retail.FactOnlineSales\n  GROUP BY CustomerKey\n) cust_spend\nJOIN retail.DimCustomer c ON c.CustomerKey = cust_spend.CustomerKey\nWHERE c.YearlyIncome IS NOT NULL",
          "result_path": "refs/cube/Q91-1.csv"
        },
        {
          "interpretation": "问法歧义：Spearman相关，重复值使用平均秩，观察域与Pearson一致",
          "sql": "WITH domain AS (SELECT c.YearlyIncome AS x,sum(f.SalesAmount) AS y FROM retail.FactOnlineSales f JOIN retail.DimCustomer c ON f.CustomerKey=c.CustomerKey WHERE c.YearlyIncome IS NOT NULL GROUP BY f.CustomerKey,c.YearlyIncome),\nfrequency AS (SELECT x,y,count() AS w FROM domain WHERE x IS NOT NULL AND y IS NOT NULL GROUP BY x,y),\nranks AS (SELECT *,\nsum(w) OVER (ORDER BY x RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)-(sum(w) OVER (PARTITION BY x)-1)/2.0 AS rx,\nsum(w) OVER (ORDER BY y RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)-(sum(w) OVER (PARTITION BY y)-1)/2.0 AS ry FROM frequency),\ncentered AS (SELECT *,sum(w*rx) OVER ()/sum(w) OVER () AS mx,\nsum(w*ry) OVER ()/sum(w) OVER () AS my FROM ranks)\nSELECT sum(w*(rx-mx)*(ry-my))/nullIf(sqrt(sum(w*pow(rx-mx,2))*sum(w*pow(ry-my,2))),0) AS income_spend_correlation,sum(w) AS customers_analyzed\nFROM centered",
          "result_path": "refs/cube/Q91-2.csv"
