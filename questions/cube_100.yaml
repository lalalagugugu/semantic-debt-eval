          "sql": "WITH introductions AS (SELECT toInt32(ProductSubcategoryKey) AS subcategory_key,min(toDate(AvailableForSaleDate)) AS introduction_date FROM retail.DimProduct WHERE toDate(AvailableForSaleDate) BETWEEN '2008-01-01' AND '2009-12-31' GROUP BY subcategory_key), windows AS (SELECT *,least(dateDiff('day',toDate('2007-01-01'),introduction_date),dateDiff('day',introduction_date,toDate('2010-01-01'))) AS window_days FROM introductions), old_sales AS (SELECT w.subcategory_key,w.introduction_date,w.window_days,sumIf(f.SalesAmount,f.DateKey<w.introduction_date) AS before_sales,sumIf(f.SalesAmount,f.DateKey>=w.introduction_date) AS after_sales FROM windows w JOIN retail.DimProduct p ON toInt32(p.ProductSubcategoryKey)=w.subcategory_key JOIN retail.FactOnlineSales f ON f.ProductKey=p.ProductKey WHERE toDate(p.AvailableForSaleDate)<w.introduction_date AND f.DateKey>=subtractDays(w.introduction_date,toInt32(w.window_days)) AND f.DateKey<addDays(w.introduction_date,toInt32(w.window_days)) GROUP BY w.subcategory_key,w.introduction_date,w.window_days) SELECT o.subcategory_key,ps.ProductSubcategoryName,o.introduction_date,o.window_days,o.before_sales/o.window_days AS before_daily_sales,o.after_sales/o.window_days AS after_daily_sales FROM old_sales o JOIN retail.DimProductSubcategory ps ON o.subcategory_key=ps.ProductSubcategoryKey",
