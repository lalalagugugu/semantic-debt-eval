      "type": "指标分析",
      "refs": [
        {
          "interpretation": "原参考解读",
          "sql": "SELECT d.IsWorkDay, sum(s.SalesAmount) as sales, round(sum(s.SalesAmount) * 100.0 / (SELECT sum(SalesAmount) FROM retail.FactOnlineSales), 2) as percentage FROM retail.FactOnlineSales s JOIN retail.DimDate d ON s.DateKey = d.DateKey GROUP BY d.IsWorkDay",
