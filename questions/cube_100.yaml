      "text_en": "Which products had the biggest second-half comeback in 2009 — meaning H2 sales dramatically exceeded H1?",
      "text_zh": "2009 年哪些产品在下半年的销售反弹最大，即下半年销售额大幅超过上半年？",
      "type": "统计",
      "refs": [
        {
          "interpretation": "示例：原参考解读",
          "sql": "SELECT if(p.ProductKey=0,NULL,p.ProductName) AS ProductName,\n       sumIf(f.SalesAmount, toMonth(f.DateKey) <= 6) AS h1_sales,\n       sumIf(f.SalesAmount, toMonth(f.DateKey) >= 7) AS h2_sales,\n       (sumIf(f.SalesAmount, toMonth(f.DateKey) >= 7) - sumIf(f.SalesAmount, toMonth(f.DateKey) <= 6))\n         * 100.0 / nullif(sumIf(f.SalesAmount, toMonth(f.DateKey) <= 6), 0) AS h2_vs_h1_pct,f.ProductKey AS ProductKey\nFROM retail.FactOnlineSales f\nLEFT JOIN retail.DimProduct p ON p.ProductKey = f.ProductKey\nWHERE toYear(f.DateKey) = 2009\nGROUP BY f.ProductKey,p.ProductKey,p.ProductName\nHAVING h1_sales >= 1000 AND h2_sales > h1_sales\nORDER BY h2_vs_h1_pct DESC\nLIMIT 15",
          "result_path": "refs/cube/Q97-1.csv"
        },
        {
          "interpretation": "示例：按H2较H1的增加额排序，取前15名，不设H1下限",
          "sql": "SELECT f.ProductKey AS ProductKey,if(p.ProductKey=0,NULL,p.ProductName) AS ProductName,sumIf(f.SalesAmount,toMonth(f.DateKey)<=6) AS h1_sales,sumIf(f.SalesAmount,toMonth(f.DateKey)>=7) AS h2_sales,h2_sales-h1_sales AS sales_increase FROM retail.FactOnlineSales f LEFT JOIN retail.DimProduct p ON f.ProductKey=p.ProductKey WHERE toYear(f.DateKey)=2009 GROUP BY f.ProductKey,p.ProductKey,p.ProductName HAVING sales_increase>0 ORDER BY sales_increase DESC LIMIT 15",
