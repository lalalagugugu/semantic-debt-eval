    {
      "id": "Q117",
      "source": "new",
      "text_en": "For the three comparable stores with the greatest 2009 decline, which category contributed most to each decline?",
      "text_zh": "在2009年同店销售下降的门店中，降幅最大的3家门店各自由哪个产品品类拖累最多？列出门店降幅、该品类销售减少额及其占门店总减少额的百分比。",
      "type": "指标分析",
      "refs": [
        {
          "interpretation": "遵守企业约定及题干限定口径",
          "sql": "WITH totals AS (\nSELECT StoreKey,sumIf(SalesAmount,toYear(DateKey)=2008) AS sales_2008,sumIf(SalesAmount,toYear(DateKey)=2009) AS sales_2009\nFROM retail.FactSales WHERE toYear(DateKey) IN (2008,2009) GROUP BY StoreKey HAVING sales_2008>0 AND sales_2009>0 AND sales_2009<sales_2008),\ncategories AS (SELECT f.StoreKey AS StoreKey,if(pc.ProductCategoryKey=0,NULL,pc.ProductCategoryName) AS category,\nsumIf(f.SalesAmount,toYear(f.DateKey)=2008)-sumIf(f.SalesAmount,toYear(f.DateKey)=2009) AS decline_amount, sumIf(f.SalesAmount,toYear(f.DateKey)=2008) AS category_base_sales\nFROM retail.FactSales f LEFT JOIN retail.DimProduct p ON f.ProductKey=p.ProductKey\nLEFT JOIN retail.DimProductSubcategory ps ON p.ProductSubcategoryKey=ps.ProductSubcategoryKey\nLEFT JOIN retail.DimProductCategory pc ON ps.ProductCategoryKey=pc.ProductCategoryKey WHERE toYear(f.DateKey) IN (2008,2009) GROUP BY f.StoreKey,category)\nSELECT t.StoreKey,s.StoreName,(t.sales_2008-t.sales_2009)*100.0/t.sales_2008 AS decline_pct,\nc.category,c.decline_amount,c.decline_amount*100.0/(t.sales_2008-t.sales_2009) AS contribution_pct, t.sales_2008-t.sales_2009 AS store_decline_amount, c.decline_amount*100.0/nullIf(c.category_base_sales,0) AS category_decline_pct\nFROM totals t JOIN categories c ON t.StoreKey=c.StoreKey LEFT JOIN retail.DimStore s ON t.StoreKey=s.StoreKey\nORDER BY decline_pct DESC,decline_amount DESC",
          "result_path": "refs/new/Q117-1.csv"
        }
      ],
      "scoring": "deterministic",
      "scoring_notes": "第二轮已批准问句；按企业约定计算。业务口径按冻结约定及2026-10-17裁决；题目参数与问法歧义按逐参考说明。\n完整事实门店分母；先按降幅选3店，再每店选下降金额最大品类，两个层级保存完整量化边界。完整事实金额保留；NULL分类是无法分类事实的披露汇总，不冒充真实品类，不虚构维度。",
