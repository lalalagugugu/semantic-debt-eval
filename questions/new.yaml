          "sql": "WITH baskets AS (\nSELECT f.SalesOrderNumber,groupUniqArrayIf(f.ProductKey,p.BrandName='Contoso') AS products\nFROM retail.FactOnlineSales f LEFT JOIN retail.DimProduct p ON f.ProductKey=p.ProductKey\nWHERE toYear(f.DateKey)=2009 GROUP BY f.SalesOrderNumber),\nfirst_product AS (SELECT SalesOrderNumber,products,arrayJoin(products) AS product1_key FROM baskets),\npairs AS (SELECT product1_key,product2_key,count() AS both_orders FROM first_product ARRAY JOIN products AS product2_key\nWHERE product1_key<product2_key GROUP BY product1_key,product2_key),\nmarginal AS (SELECT product1_key AS ProductKey,count() AS product_orders FROM first_product GROUP BY product1_key),\ntotal AS (SELECT count() AS all_orders FROM baskets)\nSELECT x.product1_key AS product1_key,toNullable(a.ProductName) AS product1_name,\nx.product2_key AS product2_key,toNullable(b.ProductName) AS product2_name,\nx.both_orders AS common_orders,x.both_orders*1.0*t.all_orders/(ma.product_orders*mb.product_orders) AS lift_ratio\nFROM pairs x JOIN marginal ma ON x.product1_key=ma.ProductKey\nJOIN marginal mb ON x.product2_key=mb.ProductKey CROSS JOIN total t\nLEFT JOIN retail.DimProduct a ON x.product1_key=a.ProductKey\nLEFT JOIN retail.DimProduct b ON x.product2_key=b.ProductKey\nORDER BY common_orders DESC LIMIT 10",
