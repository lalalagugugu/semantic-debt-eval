    {
      "id": "Q120",
      "source": "new",
      "text_en": "What were Pearson correlations between annual income and 2009 spending overall and within occupations, with customer counts? Use scope labels 全体 and 职业内; the overall occupation is NULL, while occupation rows use the recorded occupation names.",
      "text_zh": "对2009年购买过商品的客户，客户年收入与当年消费额的Pearson相关系数，在全体客户和各职业内分别是多少？列出各组客户数。范围标签统一使用“全体”和“职业内”；全体行的职业列为空，职业内行使用数据中的职业名称。",
      "type": "统计",
      "refs": [
        {
          "interpretation": "遵守企业约定及题干限定口径；购买事件=全部行（含纯退货行）",
          "sql": "WITH spend AS (SELECT CustomerKey,sum(SalesAmount) AS annual_sales FROM retail.FactOnlineSales WHERE toYear(DateKey)=2009 GROUP BY CustomerKey),\ncustomers AS (SELECT f.CustomerKey,c.YearlyIncome AS income,c.Occupation AS occupation,f.annual_sales\nFROM spend f LEFT JOIN retail.DimCustomer c ON f.CustomerKey=c.CustomerKey WHERE c.YearlyIncome IS NOT NULL)\nSELECT '全体' AS scope,CAST(NULL,'Nullable(String)') AS occupation,count() AS customers,corr(income,annual_sales) AS income_sales_corr FROM customers\nUNION ALL SELECT '职业内',occupation,count() AS customers,corr(income,annual_sales) AS income_sales_corr FROM customers GROUP BY occupation",
          "result_path": "refs/new/Q120-1.csv"
        }
      ],
      "scoring": "deterministic",
      "scoring_notes": "第二轮已批准问句；按企业约定计算。业务口径按冻结约定及2026-10-17裁决；题目参数与问法歧义按逐参考说明。\n每客户一行、等权；缺收入不参与相关，收入离群值不删除；不预设辛普森反转，不平均组内系数。",
