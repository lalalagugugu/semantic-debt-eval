    {
      "id": "Q116",
      "source": "new",
      "text_en": "As of December 31, 2009, by true first-purchase month, what share of customers purchased again during the seven calendar days starting the day after their first purchase? Exclude customers without seven full days of follow-up.",
      "text_zh": "以2009年12月31日为观察截止日，按客户的真实首购月份分群，首购次日起7个自然日内的复购率分别是多少？排除观察期不足7天的客户。",
      "type": "指标分析",
      "refs": [
        {
          "interpretation": "首购次日起7个自然日；截止2009-12-31已完成观察；购买事件=全部行",
          "sql": "WITH cohorts AS (SELECT CustomerKey,min(DateKey) AS first_date FROM retail.FactOnlineSales GROUP BY CustomerKey\nHAVING addDays(first_date,7)<=toDate('2009-12-31')),\nobserved AS (SELECT c.CustomerKey AS CustomerKey,c.first_date AS first_date,countDistinctIf(f.SalesOrderNumber,f.DateKey>c.first_date AND f.DateKey<=addDays(c.first_date,7)) AS purchases\nFROM cohorts c LEFT JOIN retail.FactOnlineSales f ON c.CustomerKey=f.CustomerKey GROUP BY c.CustomerKey,c.first_date)\nSELECT toStartOfMonth(first_date) AS cohort_month,countIf(purchases>0)*100.0/count() AS repurchase_pct, count() AS cohort_customers\nFROM observed GROUP BY cohort_month",
          "result_path": "refs/new/Q116-1.csv"
        }
