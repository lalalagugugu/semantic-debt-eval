    {
      "id": "Q104",
      "source": "new",
      "text_en": "Which categories increased revenue but decreased gross profit from 2008 to 2009, and by how much?",
      "text_zh": "2009年比2008年营收增加但毛利减少的产品品类有哪些？各自两项金额变化是多少？",
      "type": "指标分析",
      "refs": [
        {
          "interpretation": "遵守企业约定及题干限定口径",
          "sql": "SELECT if(pc.ProductCategoryKey=0,NULL,pc.ProductCategoryName) AS category,\nsumIf(f.SalesAmount,toYear(f.DateKey)=2009)-sumIf(f.SalesAmount,toYear(f.DateKey)=2008) AS sales_change_amount,\nsumIf(f.SalesAmount-f.TotalCost,toYear(f.DateKey)=2009)-sumIf(f.SalesAmount-f.TotalCost,toYear(f.DateKey)=2008) AS margin_change_amount, sales_change_amount*100.0/nullIf(sumIf(f.SalesAmount,toYear(f.DateKey)=2008),0) AS sales_change_pct, margin_change_amount*100.0/nullIf(sumIf(f.SalesAmount-f.TotalCost,toYear(f.DateKey)=2008),0) AS margin_change_pct\nFROM retail.FactOnlineSales f LEFT JOIN retail.DimProduct p ON f.ProductKey=p.ProductKey\nLEFT JOIN retail.DimProductSubcategory ps ON p.ProductSubcategoryKey=ps.ProductSubcategoryKey\nLEFT JOIN retail.DimProductCategory pc ON ps.ProductCategoryKey=pc.ProductCategoryKey WHERE toYear(f.DateKey) IN (2008,2009)\nGROUP BY category HAVING sales_change_amount>0 AND margin_change_amount<0",
          "result_path": "refs/new/Q104-1.csv"
        }
      ],
      "scoring": "deterministic",
      "scoring_notes": "第二轮已批准问句；按企业约定计算。业务口径按冻结约定及2026-10-17裁决；题目参数与问法歧义按逐参考说明。\n完整事实金额保留；NULL分类是无法分类事实的披露汇总，不冒充真实品类，不虚构维度。",
